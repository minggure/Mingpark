<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ming Park - 인기 공연 예매</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="navbar">
    <div class="navbar-brand" onclick="showListPage()">
        <img class="brand-logo" src="/images/mingpark-logo.png" alt="Ming Park">
    </div>
    <div class="auth-area" id="auth-area"></div>
</div>

<div class="container">
    <section id="list-section" class="page-section active">
        <h2>🎵 현재 상영 및 예정 공연</h2>
        <div id="concert-container"></div>
        <div id="pagination"></div>
    </section>

    <section id="detail-section" class="page-section">
        <div class="detail-layout" id="detail-content"></div>
    </section>

    <section id="mypage-section" class="page-section"></section>
</div>

<div class="modal-overlay" id="login-modal">
    <div class="modal-box">
        <span class="modal-close" onclick="closeModal('login-modal')">&times;</span>
        <h3>Ming Park 로그인</h3>
        <div class="input-group"><input type="text" id="loginId" placeholder="아이디를 입력하세요"></div>
        <div class="input-group"><input type="password" id="password" placeholder="비밀번호를 입력하세요"></div>
        <button class="modal-submit" onclick="handleLogin()">로그인하기</button>
    </div>
</div>

<div class="modal-overlay" id="signup-modal">
    <div class="modal-box">
        <span class="modal-close" onclick="closeModal('signup-modal')">&times;</span>
        <h3>Ming Park 회원가입</h3>
        <div class="input-group"><input type="text" id="newName" placeholder="이름을 입력하세요"></div>
        <div class="input-group"><input type="text" id="newLoginId" placeholder="아이디를 입력하세요 (4자 이상)"></div>
        <div class="input-group"><input type="password" id="newPassword" placeholder="비밀번호를 입력하세요 (8자 이상)"></div>
        <div class="input-group"><input type="email" id="newEmail" placeholder="이메일을 입력하세요"></div>
        <button class="modal-submit" onclick="handleSignup()">회원가입하기</button>
    </div>
</div>

<div class="modal-overlay" id="seat-modal">
    <div class="modal-box seat-modal-box">
        <span class="modal-close" onclick="closeModal('seat-modal')">&times;</span>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; font-size: 20px;">🟢 실시간 좌석 배치도</h3>
            <button id="refresh-seats-btn" class="refresh-btn">
                <span>🔄</span> 좌석 새로고침
            </button>
        </div>
        <div class="stage-area">S T A G E</div>
        <div class="zone-container">
            <div class="seat-zone"><div class="zone-title">A 구역 (좌측)</div><div id="zone-A" class="seat-grid"></div></div>
            <div class="seat-zone"><div class="zone-title">B 구역 (우측)</div><div id="zone-B" class="seat-grid"></div></div>
        </div>
    </div>
</div>

<script>
    let currentPage = 0;
    let targetConcertId = null;
    let myCurrentPoints = 1234567;

    window.onload = function() {
        checkLoginStatus();
        loadConcerts(currentPage);

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('target');

        if (targetId) {
            loadConcertDetail(targetId);
        }
    };

    function checkLoginStatus() {
        const authArea = document.getElementById('auth-area');
        const loginUser = localStorage.getItem("loginMemberName");
        const loginRole = localStorage.getItem("loginMemberRole");

        if (loginUser) {
            const registerButton = loginRole === 'ADMIN'
                ? `<button class="nav-btn btn-primary" onclick="location.href='/register.html'">공연 등록</button>`
                : '';
            authArea.innerHTML = `
                <span class="user-welcome" style="cursor:pointer;" onclick="showMyPage()">👋 ${loginUser}님 환영합니다!</span>
                ${registerButton}
                <button class="nav-btn btn-secondary" onclick="handleLogout()">로그아웃</button>
            `;
        } else {
            authArea.innerHTML = `
                <button class="nav-btn btn-primary" onclick="openModal('login-modal')">로그인</button>
                <button class="nav-btn btn-secondary" onclick="openModal('signup-modal')">회원가입</button>
            `;
        }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function handleLogin() {
        const loginId = document.getElementById('loginId').value;
        const password = document.getElementById('password').value;
        fetch('/members/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ loginId, password })
        })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert(result.memberName + '님, 환영합니다!');
                    localStorage.setItem("loginMemberName", result.memberName);
                    localStorage.setItem("loginMemberRole", result.role);
                    closeModal('login-modal');
                    checkLoginStatus();
                } else { alert('정보를 다시 확인해주세요.'); }
            });
    }

    function handleSignup() {
        const name = document.getElementById('newName').value;
        const loginId = document.getElementById('newLoginId').value;
        const password = document.getElementById('newPassword').value;
        const email = document.getElementById('newEmail').value;
        fetch('/members/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, loginId, password, email })
        })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('회원가입 완료!'); closeModal('signup-modal'); openModal('login-modal');
                }
            });
    }

    function handleLogout() {
        fetch('/members/logout', { method: 'POST' }).finally(() => {
            localStorage.removeItem("loginMemberName");
            localStorage.removeItem("loginMemberRole");

            const loginIdInput = document.getElementById('loginId');
            const passwordInput = document.getElementById('password');

            if (loginIdInput) loginIdInput.value = '';
            if (passwordInput) passwordInput.value = '';

            alert('로그아웃 되었습니다.');
            showListPage();
            checkLoginStatus();
        });
    }

    function showListPage() {
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        document.getElementById('detail-section').classList.remove('active');
        document.getElementById('mypage-section').classList.remove('active');
        document.getElementById('list-section').classList.add('active');
        loadConcerts(currentPage);
    }

    // mypage.html로 비동기 수신하여 주입하는 SPA 제어 함수
    function showMyPage() {
        const myPageSection = document.getElementById('mypage-section');

        fetch('/mypage.html')
            .then(res => {
                if (!res.ok) throw new Error("mypage.html 파일을 찾을 수 없습니다.");
                return res.text();
            })
            .then(htmlTemplate => {
                myPageSection.innerHTML = htmlTemplate;

                document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
                myPageSection.classList.add('active');

                return fetch('/api/users/me/points', { credentials: 'include' });
            })
            .then(res => {
                if (res && (res.status === 401 || res.status === 403)) {
                    handle401Error();
                    return null;
                }
                return res ? res.json() : null;
            })
            .then(data => {
                if (!data) return;

                const name = data.name || localStorage.getItem("loginMemberName") || "-";
                const email = data.email || "-";
                myCurrentPoints = data.point !== undefined ? data.point : myCurrentPoints;

                document.getElementById('my-name').innerText = name;
                document.getElementById('my-email').innerText = email;
                document.getElementById('my-point').innerText = Number(myCurrentPoints).toLocaleString() + "P";
            })
            .catch((err) => {
                console.warn("백엔드 API 미완성 또는 유휴 상태로 가상 마이페이지 데이터 출력: ", err.message);
                if (document.getElementById('my-name')) {
                    document.getElementById('my-name').innerText = localStorage.getItem("loginMemberName") || "테스트유저";
                    document.getElementById('my-email').innerText = "test-user@mingpark.com";
                    document.getElementById('my-point').innerText = Number(myCurrentPoints).toLocaleString() + "P";
                }
            });
    }
    function loadConcerts(page) {
        currentPage = page;
        fetch(`/api/concerts?page=${page}&size=6`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('concert-container');
                container.innerHTML = '';
                data.content.forEach(concert => {
                    const card = document.createElement('div');
                    card.className = 'concert-card';
                    card.onclick = () => loadConcertDetail(concert.concertId);
                    card.innerHTML = `
                        <div>
                            <img class="concert-image" src="${concert.image}">
                            <div class="concert-title">${concert.concertTitle}</div>
                            <div class="concert-info">📍 장소: ${concert.place || '추후 공지'}</div>
                            <div class="concert-info">📅 날짜: ${concert.concertDate}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
                renderPagination(data.totalPages);
            });
    }

    function loadConcertDetail(concertId) {
        targetConcertId = concertId;
        fetch(`/api/concerts/${concertId}`)
            .then(res => res.json())
            .then(concert => {
                const detailContent = document.getElementById('detail-content');
                const priceFormatted = Number(concert.concertPrice).toLocaleString();

                detailContent.innerHTML = `
                    <section><img class="poster" src="${concert.image}"></section>
                    <section>
                        <h1 class="detail-title">${concert.concertTitle}</h1>
                        <p class="description">${concert.description || '등록된 공연 설명이 없습니다.'}</p>
                        <div class="info-row"><span class="info-label">장소</span><span>${concert.place || '장소 미정'}</span></div>
                        <div class="info-row"><span class="info-label">공연 일정</span><span>${concert.concertDate} ${concert.concertTime}</span></div>
                        <div class="info-row"><span class="info-label">가격</span><span>${priceFormatted}원</span></div>
                        <div class="info-row"><span class="info-label">예매 여부</span><span>${concert.reservationAvailable ? '예매 가능' : '예매 불가'}</span></div>

                        <div class="actions">
                            <button class="btn btn-secondary" onclick="showListPage()">목록으로</button>
                            <button class="btn btn-primary" ${concert.reservationAvailable ? '' : 'disabled'} onclick="tryReserve()">
                                ${concert.reservationAvailable ? '예매하기' : '예매 불가'}
                            </button>
                        </div>
                    </section>
                `;
                document.getElementById('list-section').classList.remove('active');
                document.getElementById('detail-section').classList.add('active');
            })
            .catch(() => alert("공연 상세 정보를 불러오는 데 실패했습니다."));
    }

    function tryReserve() {
        const loginUser = localStorage.getItem("loginMemberName");
        if (!loginUser) {
            alert("🔒 로그인이 필요한 서비스입니다! 상단의 로그인 버튼을 이용해 주세요.");
            openModal('login-modal');
            return;
        }
        openModal('seat-modal');
        loadSeats();
    }

    function loadSeats() {
        if (!targetConcertId) return;

        const zoneA = document.getElementById("zone-A");
        const zoneB = document.getElementById("zone-B");
        zoneA.innerHTML = "동기화 중...";
        zoneB.innerHTML = "동기화 중...";

        fetch(`/api/concerts/${targetConcertId}/seats`, { credentials: 'include' })
            .then(res => {
                if (res.status === 401) {
                    handle401Error();
                    throw new Error("Unauthorized");
                }
                return res.json();
            })
            .then(data => {
                zoneA.innerHTML = "";
                zoneB.innerHTML = "";

                data.forEach(seat => {
                    const seatDiv = document.createElement("div");
                    seatDiv.className = `seat ${seat.status}`;
                    seatDiv.innerText = seat.seatNumber;

                    if (seat.status === 'AVAILABLE') {
                        seatDiv.onclick = () => {
                            if (confirm(`${seat.seatNumber}번 좌석을 5분간 임시 선점하시겠습니까?`)) {
                                const actualSeatId = seat.seatId !== undefined ? seat.seatId : (seat.id !== undefined ? seat.id : seat.seatNumber);
                                startReservationFlow(targetConcertId, actualSeatId, seat.seatNumber);
                            }
                        };
                    }

                    if (seat.seatNumber <= 25) zoneA.appendChild(seatDiv);
                    else zoneB.appendChild(seatDiv);
                });
            })
            .catch(() => {
                zoneA.innerHTML = ""; zoneB.innerHTML = "";
                for (let i = 1; i <= 50; i++) {
                    const seatDiv = document.createElement("div");
                    seatDiv.className = `seat AVAILABLE`;
                    seatDiv.innerText = i;
                    seatDiv.onclick = () => {
                        if (confirm(`${i}번 좌석을 5분간 임시 선점하시겠습니까?`)) {
                            startReservationFlow(targetConcertId, i, i);
                        }
                    };
                    if (i <= 25) zoneA.appendChild(seatDiv);
                    else zoneB.appendChild(seatDiv);
                }
            });
    }

    function startReservationFlow(concertId, seatId, seatNumber) {
        fetch(`/api/concerts/${concertId}/seats/${seatId}/hold`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include'
        })
            .then(async res => {
                if (res.status === 401) {
                    handle401Error();
                    return;
                }

                const result = await res.json();

                if (res.ok) {
                    alert(seatNumber + "번 좌석 선점이 완료되었습니다! (5분간 유지)");
                    closeModal('seat-modal');
                    loadSeats();
                } else {
                    alert(result.message || "아쉽습니다! 이미 다른 분이 선택한 좌석입니다.");
                    loadSeats();
                }
            })
            .catch(() => {
                alert(seatNumber + "번 좌석 선점이 완료되었습니다! (모의 테스트 상태)");
                closeModal('seat-modal');
            });
    }

    // 시큐리티 차단 및 세션 만료 예외 대응 제어 함수
    function handle401Error() {
        alert("🔒 세션이 만료되어 로그인이 해제되었습니다. 다시 로그인해 주세요!");
        closeModal('seat-modal');
        localStorage.removeItem("loginMemberName");
        localStorage.removeItem("loginMemberRole");
        checkLoginStatus();
        showListPage();
    }

    function renderPagination(totalPages) {
        const pageContainer = document.getElementById('pagination');
        pageContainer.innerHTML = '';
        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn'; prevBtn.innerText = '이전';
        prevBtn.disabled = currentPage === 0; prevBtn.onclick = () => loadConcerts(currentPage - 1);
        pageContainer.appendChild(prevBtn);

        for (let i = 0; i < totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i + 1; btn.onclick = () => loadConcerts(i);
            pageContainer.appendChild(btn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn'; nextBtn.innerText = '다음';
        nextBtn.disabled = currentPage === totalPages - 1; nextBtn.onclick = () => loadConcerts(currentPage + 1);
        pageContainer.appendChild(nextBtn);
    }

    document.getElementById("refresh-seats-btn").onclick = loadSeats;
</script>
</body>
</html>
