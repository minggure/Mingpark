<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ming Park 회원가입</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f7;
            font-family: "Malgun Gothic", Arial, sans-serif;
            color: #222;
        }

        .signup-box {
            width: min(460px, calc(100% - 32px));
            padding: 32px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 26px;
        }

        .description {
            margin-bottom: 24px;
            color: #666;
            text-align: center;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        .signup-button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .signup-button {
            margin-top: 6px;
            background: #4CAF50;
            color: #fff;
        }

        .kakao-login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            text-decoration: none;
        }

        .kakao-login-button img {
            display: block;
            width: 183px;
            height: 45px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 10px;
            color: #777;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .login-link {
            margin-top: 18px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        .login-link a {
            color: #2f7d32;
            font-weight: 700;
            text-decoration: none;
        }

        .social-hint {
            margin: 0 0 4px;
            color: #555;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
<main class="signup-box">
    <h2>Ming Park 회원가입</h2>
    <div class="description">쉽고 빠른 예매를 위해 회원이 되어보세요.</div>

    <form id="signupForm">
        <div class="input-group">
            <label for="name">이름</label>
            <input id="name" type="text" name="name" placeholder="이름을 입력하세요" maxlength="20" autocomplete="name" required>
        </div>

        <div class="input-group">
            <label for="loginId">아이디</label>
            <input id="loginId" type="text" name="loginId" placeholder="4자 이상 50자 이하로 입력하세요" minlength="4" maxlength="50" autocomplete="username" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input id="password" type="password" name="password" placeholder="8자 이상 입력하세요" minlength="8" maxlength="100" autocomplete="new-password" required>
        </div>

        <div class="input-group">
            <label for="email">이메일</label>
            <input id="email" type="email" name="email" placeholder="이메일을 입력하세요" maxlength="100" autocomplete="email" required>
        </div>

        <button class="signup-button" type="submit">회원가입</button>
    </form>

    <div class="divider">간편 시작</div>
    <p class="social-hint">카카오 계정으로 가입 없이 바로 시작할 수 있어요.</p>

    <a class="kakao-login-button" href="/members/kakao/login" aria-label="카카오로 시작하기">
        <img src="/images/kakao_login_medium_narrow.png" alt="카카오 로그인">
    </a>

    <div class="login-link">
        이미 회원이신가요? <a href="/login.html">로그인</a>
    </div>
</main>

<script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const data = {
            name: document.getElementById('name').value.trim(),
            loginId: document.getElementById('loginId').value.trim(),
            password: document.getElementById('password').value,
            email: document.getElementById('email').value.trim()
        };

        fetch('/members/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(data)
        })
            .then(response => {
                if (!response.ok) throw new Error('회원가입 실패');
                return response.json();
            })
            .then(result => {
                if (result.status === 'success') {
                    alert('회원가입이 완료되었습니다. 로그인 페이지로 이동합니다.');
                    window.location.href = '/login.html';
                }
            })
            .catch(error => {
                alert('회원가입에 실패했습니다. 아이디 중복 혹은 입력값을 확인해 주세요.');
                console.error('Error:', error);
            });
    });
</script>
</body>
</html>
