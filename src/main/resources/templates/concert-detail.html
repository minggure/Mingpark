<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${concert.concertTitle} - Ming Park|">공연 상세 - Ming Park</title>
    <style>
        /* 기존 스타일 아래에 추가 */
        .seat-map-container {
            display: none; /* 처음엔 숨겨둠 (버튼 누르면 나옴) */
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #eee;
        }

        .seat-map {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 1줄에 10개씩 배치 */
            gap: 12px;
            margin-top: 20px;
        }

        .seat {
            width: 45px;
            height: 45px;
            border-radius: 50%; /* 완벽한 동그라미 (포도알) */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        /* 상태별 포도알 색상 */
        .seat.AVAILABLE { border: 2px solid #4CAF50; background-color: white; color: #333; }
        .seat.AVAILABLE:hover { background-color: #e8f5e9; transform: scale(1.1); }

        .seat.HOLD { background-color: #ff9800; border: 2px solid #f57c00; color: white; cursor: not-allowed; }
        .seat.RESERVED { background-color: #e53935; border: 2px solid #c62828; color: white; cursor: not-allowed; }
        body {
            margin: 0;
            padding: 90px 20px 50px;
            background-color: #f5f6f7;
            color: #333;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .home-logo {
            position: fixed;
            top: 18px;
            left: 28px;
            z-index: 100;
        }

        .home-logo img {
            display: block;
            width: 210px;
            height: auto;
        }

        .detail-container {
            display: grid;
            grid-template-columns: minmax(260px, 380px) 1fr;
            gap: 50px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .poster { width: 100%; border-radius: 8px; }
        .concert-title { margin-top: 0; font-size: 32px; }

        .description {
            margin: 28px 0;
            color: #555;
            line-height: 1.8;
            white-space: pre-line;
        }

        .info-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label { font-weight: bold; }
        .actions { display: flex; gap: 12px; margin-top: 32px; }

        .button {
            padding: 13px 24px;
            border: 0;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .back-button { background-color: #e9ecef; color: #333; }
        .reservation-button { background-color: #4CAF50; color: white; }
        .reservation-button:disabled { background-color: #aaa; cursor: not-allowed; }

        @media (max-width: 760px) {
            .detail-container { grid-template-columns: 1fr; padding: 24px; }
        }
    </style>
</head>
<body>

<a class="home-logo" href="/index.html" aria-label="Ming Park 메인으로 이동">
    <img src="/images/mingpark-logo.png" alt="Ming Park">
</a>

<!-- Controller가 Model에 "concert"라는 이름으로 전달한 상세 DTO를 출력한다. -->
<main class="detail-container">
    <section>
        <img class="poster" th:src="${concert.image}" th:alt="${concert.concertTitle}">
    </section>

    <section>
        <h1 class="concert-title" th:text="${concert.concertTitle}">공연명</h1>
        <p class="description"
           th:text="${concert.description != null ? concert.description : '등록된 공연 설명이 없습니다.'}">
            공연 설명
        </p>

        <div class="info-row">
            <span class="info-label">장소</span>
            <span th:text="${concert.place != null ? concert.place : '장소 미정'}">장소</span>
        </div>
        <div class="info-row">
            <span class="info-label">공연 일정</span>
            <span th:text="|${concert.concertDate} ${concert.concertTime}|">공연 일정</span>
        </div>
        <div class="info-row">
            <span class="info-label">가격</span>
            <span th:text="|${#numbers.formatInteger(concert.concertPrice, 1, 'COMMA')}원|">가격</span>
        </div>
        <div class="info-row">
            <span class="info-label">예매 가능 기간</span>
            <span th:if="${concert.reservationStartAt != null and concert.reservationEndAt != null}"
                  th:text="|${#temporals.format(concert.reservationStartAt, 'yyyy-MM-dd HH:mm')} ~ ${#temporals.format(concert.reservationEndAt, 'yyyy-MM-dd HH:mm')}|">
                예매 가능 기간
            </span>
            <span th:unless="${concert.reservationStartAt != null and concert.reservationEndAt != null}">
                예매 기간 미정
            </span>
        </div>
        <div class="info-row">
            <span class="info-label">예매 가능 여부</span>
            <!-- reservationAvailable은 공연 상태와 현재 예매 기간을 기준으로 서버에서 계산한다. -->
            <span th:text="${concert.reservationAvailable ? '예매 가능' : '예매 불가'}">예매 가능 여부</span>
        </div>

        <!-- 예매 가능 여부에 따라 버튼을 활성화하거나 비활성화한다. -->
        <div class="actions">
            <a class="button back-button" href="/">목록으로</a>
            <button id="reserve-btn"
                    class="button reservation-button"
                    th:if="${concert.reservationAvailable}"
                    th:data-concert-id="${concert.concertId}">예매하기
            </button>
            <button class="button reservation-button"
                    th:unless="${concert.reservationAvailable}"
                    disabled>예매 불가
            </button>
        </div> <div id="seat-map-container" class="seat-map-container">
        <h3 style="margin-bottom: 10px;">🟢 좌석 선택 (포도알)</h3>
        <div id="seat-map" class="seat-map">
        </div>
    </div>
    </section>
</main>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const reserveBtn = document.getElementById("reserve-btn");

        if (reserveBtn) {
            reserveBtn.addEventListener("click", function () {
                    // 1. 버튼에 숨겨둔 공연 ID(concertId)를 가져온다!
                    const concertId = this.getAttribute("data-concert-id");

                    // 2. 우리가 방금 만든 그 API 주소로 GET 요청을 보낸다!
                    fetch(`/api/concerts/${concertId}/seats`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error("네트워크 응답이 정상이 아닙니다.");
                            }
                            return response.json(); // JSON 데이터를 자바스크립트 객체로 변환
                        })
                        // 기존 fetch 코드 안의 두 번째 .then(data => { ... }) 부분을 이걸로 교체!
                        .then(data => {
                            // 콘솔 출력은 유지
                            console.log("🎉 서버에서 받아온 좌석 데이터:", data);

                            // 1. 포도알 상자 가져오기
                            const container = document.getElementById("seat-map-container");
                            const seatMap = document.getElementById("seat-map");

                            // 2. 상자 초기화하고 화면에 보이게 짠!
                            seatMap.innerHTML = "";
                            container.style.display = "block";

                            // 3. 50개의 데이터를 돌면서 포도알을 하나씩 빚어내기
                            data.forEach(seat => {
                                const seatDiv = document.createElement("div");
                                // class에 'seat AVAILABLE' 처럼 상태값을 줘서 색깔을 입힘!
                                seatDiv.className = `seat ${seat.status}`;
                                seatDiv.innerText = seat.seatNumber; // 포도알 안에 번호 적기

                                // 4. 하얀 포도알(AVAILABLE)일 때만 클릭 이벤트 달아주기
                                if (seat.status === 'AVAILABLE') {
                                    seatDiv.addEventListener("click", function () {
                                        alert(`✨ ${seat.seatNumber}번 좌석을 선택했습니다.`);
                                    });
                                }

                                // 다 빚은 포도알을 상자에 쏙 넣기
                                seatMap.appendChild(seatDiv);
                            });
                        })
                }
            )
        }

    })
</script>
</body>
</html>
